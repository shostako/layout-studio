name: CI

# 検査の中身は scripts/ci.sh にある。この YAML は変えない（Claude の GitHub App には workflows 権限が無く、push が拒否される）。
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ジョブ名 ci は main の保護ルール（必須チェック）が参照している。変えるとマージできなくなる
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/ci.sh
